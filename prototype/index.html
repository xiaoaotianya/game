<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bfe9ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宝宝乐园">
<title>宝宝游戏乐园</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="hub" class="screen active">
  <header class="hub-head"><h1 id="title">宝宝游戏乐园</h1></header>
  <main id="cards" class="cards"></main>
</div>

<div id="game" class="screen">
  <button id="home" class="home emoji" aria-label="返回">🏠</button>
  <div id="stage"></div>
</div>

<div id="rest" class="overlay rest hidden">
  <div class="rest-box">
    <div class="rest-moon emoji">🌙</div>
    <div class="rest-animals emoji">🐻😴 🐰💤 🐱😴</div>
    <p class="rest-text" id="restText">休息时间到啦</p>
  </div>
</div>

<button id="gear" class="gear" aria-label="家长设置（长按）">
  <svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="16"/><circle class="ring" cx="18" cy="18" r="16" pathLength="100"/></svg>
  <span class="emoji">⚙️</span>
</button>

<div id="parent" class="overlay hidden">
  <div class="panel">
    <h2>家长设置</h2>
    <div class="field">
      <label>语言</label>
      <div class="seg" data-key="lang">
        <button data-v="zh">中文</button><button data-v="en">English</button><button data-v="both">中英双语</button>
      </div>
    </div>
    <div class="field">
      <label>每日时长</label>
      <div class="seg" data-key="limit">
        <button data-v="0">不限</button><button data-v="10">10分</button><button data-v="15">15分</button><button data-v="20">20分</button><button data-v="30">30分</button>
      </div>
    </div>
    <div class="field">
      <label>语音</label>
      <div class="seg" data-key="voice">
        <button data-v="true">开</button><button data-v="false">关</button>
      </div>
    </div>
    <div class="field">
      <label>宝宝名字</label>
      <input id="babyName" maxlength="8" placeholder="例如：佩佩（会出现在标题和表扬里）">
    </div>
    <p class="stat">今天已玩 <b id="todayMin">0</b> 分钟 <button id="resetToday" class="link">清零</button></p>
    <p class="tip">小贴士：在浏览器菜单里选「添加到主屏幕」，就能像 App 一样全屏打开。长按右上角 ⚙️ 2 秒进入本页。</p>
    <button id="closeParent" class="primary">完成</button>
  </div>
</div>

<div id="fx"></div>

<script src="js/core.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
